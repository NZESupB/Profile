name: 构建并同步代理规则

on:
  workflow_dispatch:
  push:
    branches-ignore: [rules]
    paths:
      - 'Rule/**'
      - 'Template/Meta.yaml'
      - 'Shell/*.py'
      - 'Shell/requirements-rules.txt'
      - '.github/workflows/build-rules.yml'
  pull_request:
    paths:
      - 'Rule/**'
      - 'Template/Meta.yaml'
      - 'Shell/*.py'
      - 'Shell/requirements-rules.txt'
      - '.github/workflows/build-rules.yml'

permissions:
  contents: read

concurrency:
  group: proxy-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIHOMO_VERSION: v1.19.33
      MIHOMO_ARCHIVE_SHA256: 8ec92e7b2fdc6b853ba00156bab7e4e965c8b0d843b8c4ac8ab98795f02ad524
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Shell/requirements-rules.txt
      - name: 安装检查依赖
        run: python -m pip install -r Shell/requirements-rules.txt
      - name: 检查转换脚本
        run: |
          ruff check Shell/*.py
          ruff format --check Shell/*.py
          python -m py_compile Shell/*.py
      - name: 缓存已校验的上游
        uses: actions/cache@v4
        with:
          path: .cache/rules
          key: proxy-rule-snapshots-${{ hashFiles('Rule/upstreams.lock.json', 'Rule/snapshots/*') }}
      - name: 下载固定内核并校验归档
        shell: bash
        run: |
          set -euo pipefail
          core_dir="$RUNNER_TEMP/mihomo-core"
          mkdir -p "$core_dir"
          python - "$core_dir/core.gz" "$MIHOMO_VERSION" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'Shell')
          from rule_formats import fetch_url
          version = sys.argv[2]
          archive = f'mihomo-linux-amd64-v1-{version}.gz'
          Path(sys.argv[1]).write_bytes(fetch_url(
              f'https://github.com/MetaCubeX/mihomo/releases/download/{version}/{archive}'))
          PY
          printf '%s  %s\n' "$MIHOMO_ARCHIVE_SHA256" "$core_dir/core.gz" | sha256sum --check
          gzip -dc "$core_dir/core.gz" > "$core_dir/mihomo"
          chmod +x "$core_dir/mihomo"
          echo "$core_dir" >> "$GITHUB_PATH"
      - name: 审计共享规则
        run: python Shell/rules.py audit --report "${{ runner.temp }}/rule-audit.json"
      - name: 编译 MRS、验证来源并生成各客户端
        run: python Shell/rules.py build --check-template --output dist/mihomo
      - name: 验证 rules 分支与 ghproxy URL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          sys.path.insert(0, 'Shell')
          from rules import contained_file, load_yaml, validate_config
          from rule_formats import github_origin_url, github_proxy_url, is_github_url
          package = Path(os.environ.get('RULE_PACKAGE', 'dist/mihomo')).resolve()
          spec = load_yaml(Path('Rule/build.yaml'))
          base = urlsplit(github_origin_url(spec['publish_base'].rstrip('/')))
          assert base.hostname == 'raw.githubusercontent.com'
          assert len(base.path.strip('/').split('/')) == 3
          assert base.path.rsplit('/', 1)[-1] == 'rules', '发布地址必须指向 rules 分支'
          repository = base.path.rsplit('/', 1)[0] + '/'
          def inspect(value):
              if isinstance(value, dict):
                  for item in value.values():
                      inspect(item)
              elif isinstance(value, list):
                  for item in value:
                      inspect(item)
              elif isinstance(value, str) and value.startswith(('http://', 'https://')):
                  url = urlsplit(value)
                  nested = url.path.lstrip('/')
                  if nested.startswith(('http://', 'https://')) and is_github_url(nested):
                      assert value == github_proxy_url(nested), 'GitHub URL 的 ghproxy 前缀不一致'
                  origin = github_origin_url(value)
                  if is_github_url(origin):
                      assert value == github_proxy_url(origin), 'GitHub URL 必须经过 ghproxy'
                      source = urlsplit(origin)
                      if source.hostname == base.hostname and source.path.startswith(repository):
                          assert source.path.startswith(base.path + '/'), '本仓库 URL 未引用 rules 分支'
                          contained_file(package, unquote(source.path[len(base.path) + 1:]))
          for path in (Path('Template/Meta.yaml'), package / 'config.yaml',
                       package / 'config.remote.yaml', package / 'mihomo.yaml'):
              config = load_yaml(path)
              validate_config(config)
              inspect(config)
          print('rules 分支、ghproxy URL、图标及本仓库文件路径检查通过')
          PY
      - name: 验证完整 MRS 模板与实际产物对应
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          import os
          import shutil
          import sys
          import tempfile
          from pathlib import Path
          from urllib.parse import quote
          import yaml
          sys.path.insert(0, 'Shell')
          from rules import check_core, contained_file, load_yaml, validate_config
          from rule_formats import github_proxy_url
          package = Path(os.environ.get('RULE_PACKAGE', 'dist/mihomo')).resolve()
          manifest = json.loads((package / 'manifest.json').read_text())
          assert manifest['mode'] == 'mrs'
          spec = load_yaml(Path('Rule/build.yaml'))
          artifacts = {item['name']: item for item in manifest['artifacts']}
          base = github_proxy_url(spec['publish_base']).rstrip('/')
          config = copy.deepcopy(load_yaml(Path('Template/Meta.yaml')))
          validate_config(config)
          assert not config.get('secret')
          assert set(config['rule-providers']) == set(artifacts), '模板未包含完整产物'
          with tempfile.TemporaryDirectory(prefix='mrs-template-', dir=os.environ['RUNNER_TEMP']) as directory:
              home = Path(directory)
              for name, provider in config['rule-providers'].items():
                  item = artifacts[name]
                  assert provider['url'] == base + '/' + quote(item['path'])
                  assert provider['path'] == './' + item['path']
                  assert (provider['behavior'], provider['format']) == (item['behavior'], item['format'])
                  assert provider['proxy'] == 'DIRECT'
                  if provider['behavior'] in {'domain', 'ipcidr'}:
                      assert provider['format'] == 'mrs'
                  source = contained_file(package, item['path'])
                  target = home / item['path']
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
                  provider.clear()
                  provider.update(type='file', path='./' + item['path'], behavior=item['behavior'], format=item['format'])
              validate_config(config, home)
              (home / 'config.yaml').write_text(yaml.safe_dump(config, allow_unicode=True, sort_keys=False), encoding='utf-8')
              check_core(shutil.which('mihomo'), home)
          print('完整 MRS 模板：全部 URL、格式、路径及 provider 加载检查通过')
          PY
      - name: 验证单 URL 的域名和 IP MRS 接入
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import shutil
          import sys
          from pathlib import Path
          sys.path.insert(0, 'Shell')
          from rules import check_core, load_yaml
          lock = json.loads(Path('dist/mihomo/upstreams.lock.json').read_text())
          for key in ('private', 'private-ip'):
              entry = lock['rules'][key]
              output = Path(os.environ['RUNNER_TEMP']) / key
              subprocess.run([
                  'python', 'Shell/rules_url.py', entry['url'], '--sha256', entry['sha256'],
                  '--name', 'URL验证', '--output', str(output),
                  '--config', 'dist/mihomo/config.yaml',
                  *(['--no-resolve'] if key == 'private-ip' else []),
              ], check=True)
              check_core(shutil.which('mihomo'), output)
          config = load_yaml(Path('Template/Meta.yaml'))
          assert not config.get('secret'), '公开模板不得含真实控制器密钥'
          for item in config['proxy-providers'].values():
              assert item['type'] == 'inline'
              assert all(node['type'] == 'direct' for node in item['payload'])
          PY
      - name: 验证重复构建一致性与无 Geodata
        shell: bash
        run: |
          set -euo pipefail
          python Shell/rules.py build --offline --output "$RUNNER_TEMP/mihomo-repeat"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          first = json.loads(Path('dist/mihomo/manifest.json').read_text())
          second = json.loads((Path(os.environ['RUNNER_TEMP']) / 'mihomo-repeat/manifest.json').read_text())
          assert first == second, '相同输入的两次产物不一致'
          assert first['mode'] == 'mrs'
          assert any(item['format'] == 'mrs' for item in first['artifacts'])
          assert not any(Path(p).suffix in {'.dat', '.mmdb'} for p in first['files'])
          assert set(first['clients']) == {'clash', 'surge', 'surfboard', 'shadowrocket', 'quantumultx'}
          PY
      - name: 打包全部运行配置和客户端规则
        run: tar -czf dist/mihomo-rules.tar.gz -C dist mihomo
      - name: 上传完整运行包
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-rules-${{ github.sha }}
          path: dist/mihomo-rules.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: 上传待发布目录
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: generated-proxy-rules
          path: dist/mihomo/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-proxy-rules
      cancel-in-progress: false
    steps:
      - name: 检出来源提交
        uses: actions/checkout@v4
      - name: 下载已验证产物
        uses: actions/download-artifact@v4
        with:
          name: generated-proxy-rules
          path: ${{ runner.temp }}/generated-rules
      - name: 发布到独立 rules 分支
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # 只复制公开模板和已校验规则，保留 rules 分支历史。
          if git ls-remote --exit-code --heads origin rules >/dev/null; then
            git fetch origin rules
            git worktree add "$RUNNER_TEMP/publish-rules" -b rules FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/publish-rules"
            git -C "$RUNNER_TEMP/publish-rules" switch --orphan rules
          fi
          cd "$RUNNER_TEMP/publish-rules"
          git rm -r --ignore-unmatch .
          cp -R "$RUNNER_TEMP/generated-rules/." .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "同步代理规则 ${SOURCE_SHA}"
            git push origin HEAD:rules
          fi
