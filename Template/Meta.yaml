# 基于根目录 Meta.yaml 的公开构建模板；原配置与真实密钥保留在本机。
# 使用 Actions 产物 config.yaml（同包文件）或 mihomo.yaml（rules 分支远程规则）。
ProviderTest: &ProviderTest
  type: http
  interval: 43200
  health-check:
    enable: true
    url: https://cp.cloudflare.com
    interval: 14400
GroupSelect: &GroupSelect
  type: select
  url: https://cp.cloudflare.com
  include-all-providers: true
GroupLoadBalance: &GroupLoadBalance
  type: load-balance
  url: https://cp.cloudflare.com
  interval: 300
  lazy: true
  strategy: round-robin
  timeout: 2000
  max-failed-times: 3
  include-all-providers: true
RuleSet_classical: &RuleSet_classical
  type: http
  behavior: classical
  format: text
  interval: 43200
  proxy: DIRECT
RuleSet_geosite: &RuleSet_geosite
  type: http
  behavior: classical
  format: yaml
  interval: 43200
  proxy: DIRECT
RuleSet_ipcidr: &RuleSet_ipcidr
  type: http
  behavior: ipcidr
  format: mrs
  interval: 43200
  proxy: DIRECT

mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: true
external-controller: 127.0.0.1:9999
secret: ''
external-ui: ui
external-ui-name: xd
external-ui-url: https://ghu.nxnow.top/https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip
unified-delay: true
global-ua: ClashMetaForAndroid/2.11.18
hosts:
  mtalk.google.com: [142.250.107.188, 142.251.170.188]
  alt1-mtalk.google.com: 192.178.164.188
  alt2-mtalk.google.com: 192.178.164.188
  alt3-mtalk.google.com: [192.178.164.188, 74.125.131.188]
  alt4-mtalk.google.com: [192.178.164.188, 74.125.131.188]
  alt5-mtalk.google.com: [108.177.125.188, 74.125.131.188]
  alt6-mtalk.google.com: [192.178.131.188, 209.85.144.188]
  alt7-mtalk.google.com: [192.178.131.188, 209.85.144.188]
  alt8-mtalk.google.com: [192.178.131.188, 209.85.144.188]

dns:
  enable: true
  prefer-h3: false
  cache-algorithm: arc
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fc00::/18
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  rebind: false
  default-nameserver: [system, 119.29.29.29, 223.5.5.5]
  nameserver:
    - system
    - https://cn.udns.dev:851/dns-query
  proxy-server-nameserver:
    - system
    - https://cn.udns.dev:851/dns-query
  fake-ip-filter:
    - +.lan
    - +.local
    - rule-set:国内域名,连通性检测,私有域名,其他直连
    # 构建时追加 Rule/fakeipfillter.txt 的原始 DNS 通配模式。
  nameserver-policy:
    'rule-set:国内域名,私有域名':
      - system
      - https://120.53.53.53/dns-query
      - https://223.5.5.5/dns-query

tun:
  enable: true
  stack: mixed
  dns-hijack: [any:53, tcp://any:53]
  strict-route: true
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  mtu: 1280
  disable-icmp-forwarding: true

# 直连占位不含订阅信息。在本机替换为 <<: *ProviderTest、url 和独立 path。
proxies: []
proxy-providers:
  Kitony:
    type: inline
    payload: [{name: 订阅直连占位, type: direct}]
  Home_Proxy:
    type: inline
    payload: [{name: 家庭直连占位, type: direct}]
proxy-groups:
  - name: 全球互联
    <<: *GroupSelect
    filter: '(港*IPLC|IEPL|专线|UDPN|TX|阿里)'
    proxies: [🇭🇰 香港, 🇯🇵 日本, 🇺🇸 美国, 🇹🇼 台湾, 🇸🇬 新加坡]
    icon: https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Global.png
  - name: 游戏娱乐
    <<: *GroupSelect
    filter: '(IPLC|IEPL|专线|Game|UDPN|TX)'
    proxies: [全球互联, 🇭🇰 香港, 🇯🇵 日本, 🇺🇸 美国, 🇹🇼 台湾, 🇸🇬 新加坡, DIRECT]
    icon: https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Game.png
  - name: 测速下载
    type: select
    use: [Kitony]
    proxies: [DIRECT, 🇭🇰 香港, 🇹🇼 台湾, 🇯🇵 日本, 🇺🇸 美国, 🇸🇬 新加坡, 全球互联]
    icon: https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Download.png
  - name: 漏网之鱼
    type: select
    proxies: [DIRECT, 全球互联, 🇭🇰 香港, 🇹🇼 台湾, 🇯🇵 日本, 🇺🇸 美国, 🇸🇬 新加坡, 所有地区, 直连Fallback]
    icon: https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Final.png
  - name: TelegramDC5
    type: select
    proxies: [全球互联, 🇭🇰 香港, 🇯🇵 日本, 🇺🇸 美国, 🇹🇼 台湾, 🇸🇬 新加坡]
    icon: https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Telegram.png
  - name: 直连域名
    type: select
    proxies: [DIRECT, 直连Fallback]
    icon: https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Direct.png
  - name: 🇭🇰 香港
    <<: *GroupSelect
    filter: '(^(?!.*(Frp|游戏|Game).*).*(-港|香港|HKT|HKBN))'
    proxies: [香港LoadBalance]
    icon: https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Hong_Kong.png
  - name: 香港LoadBalance
    <<: *GroupLoadBalance
    filter: HKT
    icon: https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Back.png
  - name: 🇯🇵 日本
    <<: *GroupSelect
    filter: '(^(?!.*(Frp|游戏|Game).*).*(-日|日本))'
    icon: https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Japan.png
  - name: 🇹🇼 台湾
    <<: *GroupSelect
    filter: '(^(?!.*(Frp|游戏|Game).*).*(-台|台湾))'
    icon: https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Taiwan.png
  - name: 🇸🇬 新加坡
    <<: *GroupSelect
    filter: '(^(?!.*(Frp|游戏|Game).*).*(-坡|新加坡))'
    icon: https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Singapore.png
  - name: 🇺🇸 美国
    <<: *GroupSelect
    filter: '(^(?!.*(Frp|游戏|Game).*).*(-美|美国|圣何塞))'
    icon: https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/United_States.png
  - name: 所有地区
    <<: *GroupSelect
    filter: '(^(?!.*(Frp|游戏|Game|公告).*).*)'
  - name: 直连Fallback
    type: fallback
    use: [Home_Proxy]
    url: http://g.alicdn.com
    interval: 7200
    icon: https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Back.png
  - name: 广告拦截
    type: select
    proxies: [REJECT, DIRECT]
    icon: https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Advertising.png

