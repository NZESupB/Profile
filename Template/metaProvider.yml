# 参考 AIsouler/MyClash：公共锚点 → 订阅 → DNS → 规则集 → 策略组 → 路由。
# 本文件是构建输入；先运行 Shell/rules.py build，再使用输出目录的 config.yaml。
proxy_providers_common: &proxy_provider
  type: http
  interval: 43200
  proxy: DIRECT
  health-check:
    enable: true
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    lazy: true

rule_providers_common:
  classical_text: &classical_text {type: http, behavior: classical, format: text, interval: 43200, proxy: DIRECT}
  classical_yaml: &classical_yaml {type: http, behavior: classical, format: yaml, interval: 43200, proxy: DIRECT}

group_common:
  select: &select {type: select}
  nodes: &nodes {type: select, include-all-providers: true}

# 在本机填写订阅，多个 provider 使用不同名称和 path；不要提交真实订阅。
proxy-providers: {}
#  Cloud1:
#    <<: *proxy_provider
#    url: "在此填写订阅链接"
#    path: ./proxy-providers/Cloud1.yaml
#    override:
#      additional-prefix: "Cloud1 | "
proxies: []

mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
external-controller: 127.0.0.1:9999
secret: ""
external-ui: ui
external-ui-name: zashboard
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
profile:
  store-selected: true
  store-fake-ip: true
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb
  asn: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb

# 构建时将 Rule/fakeipfillter.txt 的原始 DNS 通配模式追加到 fake-ip-filter。
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: true
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.home.arpa"
  default-nameserver: [223.5.5.5, 119.29.29.29]
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  nameserver:
    - https://cloudflare-dns.com/dns-query#全球互联
    - https://dns.google/dns-query#全球互联
  direct-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  direct-nameserver-follow-policy: true
  nameserver-policy:
    "geosite:private": system
    "geosite:cn,category-games@cn,googlefcm,apple@cn,microsoft@cn":
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT
    "rule-set:游戏直连,其他直连":
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT
hosts:
  dns.alidns.com: [223.5.5.5, 223.6.6.6]
  doh.pub: [1.12.12.12, 120.53.53.53]
  cloudflare-dns.com: [1.1.1.1, 1.0.0.1]
  dns.google: [8.8.8.8, 8.8.4.4]
# 独立运行需要 TUN 时启用；使用 BettBox 时由客户端管理。
tun:
  enable: false
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack: [any:53, tcp://any:53]

rule-providers:
  开发服务:
    <<: *classical_yaml
    path: ./rule-providers/category-dev.yaml
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/category-dev.yaml
  国内游戏:
    <<: *classical_yaml
    path: ./rule-providers/games-cn.yaml
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/category-games@cn.yaml
  公共游戏:
    <<: *classical_yaml
    path: ./rule-providers/games.yaml
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/category-games.yaml
  国际媒体:
    <<: *classical_text
    path: ./rule-providers/stream.list
    url: https://ruleset.skk.moe/Clash/non_ip/stream.txt
  国际媒体IP:
    <<: *classical_text
    path: ./rule-providers/stream-ip.list
    url: https://ruleset.skk.moe/Clash/ip/stream.txt
  全局规则:
    <<: *classical_text
    path: ./rule-providers/global.list
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
  CN_IP:
    <<: *classical_text
    path: ./rule-providers/china-ip.list
    url: https://raw.githubusercontent.com/DH-Teams/DH-Geo_AS_IP_CN/main/Geo_AS_IP_CN_All_Surge.list
  其他直连:
    <<: *classical_text
    path: ./rule-providers/Direct.list
    url: https://raw.githubusercontent.com/NZESupB/Profile/main/Rule/Direct.list
  游戏娱乐:
    <<: *classical_text
    path: ./rule-providers/Games.list
    url: https://raw.githubusercontent.com/NZESupB/Profile/main/Rule/Games.list
  游戏直连:
    <<: *classical_text
    path: ./rule-providers/GameDirect.list
    url: https://raw.githubusercontent.com/NZESupB/Profile/main/Rule/GameDirect.list
  海外下载:
    <<: *classical_text
    path: ./rule-providers/Download.list
    url: https://raw.githubusercontent.com/NZESupB/Profile/main/Rule/Download.list
  其他媒体:
    <<: *classical_text
    path: ./rule-providers/Video.list
    url: https://raw.githubusercontent.com/NZESupB/Profile/main/Rule/Video.list
  SpeedTest:
    # USER-AGENT 仅供其他客户端使用；构建命令生成移除该项的文本源。
    type: file
    behavior: classical
    format: text
    path: ./rules/source/Speedtest.list
  轻量浏览:
    <<: *classical_text
    path: ./rule-providers/Daily.list
    url: https://raw.githubusercontent.com/NZESupB/Profile/main/Rule/Daily.list
  US_List:
    <<: *classical_text
    path: ./rule-providers/us.list
    url: https://raw.githubusercontent.com/NZESupB/Profile/main/Rule/us.list
  JP_List:
    <<: *classical_text
    path: ./rule-providers/jp.list
    url: https://raw.githubusercontent.com/NZESupB/Profile/main/Rule/jp.list
  Reject_List:
    <<: *classical_text
    path: ./rule-providers/Reject.list
    url: https://raw.githubusercontent.com/NZESupB/Profile/main/Rule/Reject.list

proxy-groups:
  - name: 全球互联
    <<: *nodes
    filter: "(?i)(IPLC|IEPL|专线|UDPN)"
    proxies: [🇭🇰 香港, 🇯🇵 日本, 🇺🇸 美国, 🇸🇬 新加坡]
  - name: 游戏娱乐
    <<: *nodes
    filter: "(?i)(IPLC|IEPL|专线|Game|UDPN)"
    proxies: [🇭🇰 香港, 🇯🇵 日本, 🇺🇸 美国, 🇸🇬 新加坡, DIRECT]
  - name: 测速下载
    <<: *nodes
    proxies: [DIRECT, 🇭🇰 香港, 🇯🇵 日本, 🇺🇸 美国, 🇸🇬 新加坡, 全球互联]
  - name: 漏网之鱼
    <<: *select
    proxies: [DIRECT, 全球互联]
  - name: TelegramDC5
    <<: *select
    proxies: [🇸🇬 新加坡, 🇭🇰 香港]
  - name: TelegramDC4
    <<: *select
    proxies: [🇭🇰 香港, 🇺🇸 美国]
  - name: 直连域名
    <<: *select
    proxies: [DIRECT]
  - name: 🇭🇰 香港
    <<: *nodes
    filter: "(?i)(香港|港|Hong.?Kong|HK|HKT|HKBN)"
    exclude-filter: "(?i)(Frp|游戏|Game)"
    proxies: [REJECT]
  - name: 🇯🇵 日本
    <<: *nodes
    filter: "(?i)(日本|东京|大阪|Japan|JP)"
    exclude-filter: "(?i)(Frp|游戏|Game)"
    proxies: [REJECT]
  - name: 🇸🇬 新加坡
    <<: *nodes
    filter: "(?i)(新加坡|狮城|Singapore|SG)"
    exclude-filter: "(?i)(Frp|游戏|Game)"
    proxies: [REJECT]
  - name: 🇺🇸 美国
    <<: *nodes
    filter: "(?i)(美国|圣何塞|洛杉矶|United.?States|US)"
    exclude-filter: "(?i)(Frp|游戏|Game)"
    proxies: [REJECT]
  - name: 广告拦截
    <<: *select
    proxies: [REJECT, DIRECT]

# 按首条命中处理；构建仅在原位置替换 provider 分片，不重排业务策略。
rules:
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOSITE,googlefcm,DIRECT
  - AND,((NETWORK,UDP),(OR,((DST-PORT,12345),(DOMAIN-KEYWORD,bilibili),(DOMAIN-KEYWORD,mcdn)))),REJECT
  - AND,((NETWORK,TCP),(DOMAIN-KEYWORD,stun),(OR,((DOMAIN-KEYWORD,douyu),(DOMAIN-KEYWORD,bilibili)))),REJECT
  - AND,((NETWORK,UDP),(GEOSITE,youtube)),REJECT
  - RULE-SET,开发服务,测速下载
  - RULE-SET,海外下载,测速下载
  - RULE-SET,SpeedTest,测速下载
  - GEOSITE,github,全球互联
  - GEOSITE,category-scholar-!cn,全球互联
  - RULE-SET,Reject_List,REJECT
  - RULE-SET,轻量浏览,全球互联
  - RULE-SET,国内游戏,DIRECT
  - RULE-SET,游戏直连,DIRECT
  - RULE-SET,公共游戏,游戏娱乐
  - RULE-SET,游戏娱乐,游戏娱乐
  - RULE-SET,US_List,🇺🇸 美国
  - RULE-SET,JP_List,🇯🇵 日本
  - RULE-SET,其他直连,直连域名
  - GEOSITE,category-ads-all,广告拦截
  - GEOSITE,apple@cn,直连域名
  - GEOSITE,apple,测速下载
  - GEOSITE,microsoft@cn,直连域名
  - GEOSITE,microsoft,测速下载
  - AND,((NETWORK,UDP),(DST-PORT,3478)),测速下载
  - GEOSITE,youtube,全球互联
  - GEOSITE,twitter,全球互联
  - RULE-SET,其他媒体,全球互联
  - IP-ASN,44907,TelegramDC5,no-resolve
  - IP-ASN,62014,TelegramDC5,no-resolve
  - IP-ASN,59930,🇺🇸 美国,no-resolve
  - IP-ASN,62041,TelegramDC4,no-resolve
  - IP-ASN,211157,TelegramDC4,no-resolve
  - IP-CIDR,5.28.192.0/18,TelegramDC4,no-resolve
  - IP-CIDR,109.239.140.0/24,TelegramDC4,no-resolve
  - GEOSITE,telegram,全球互联
  - GEOIP,telegram,全球互联,no-resolve
  - RULE-SET,国际媒体,全球互联
  - RULE-SET,国际媒体IP,全球互联
  - RULE-SET,全局规则,全球互联
  - GEOSITE,cn,直连域名
  - RULE-SET,CN_IP,直连域名
  - GEOIP,cn,直连域名
  - MATCH,漏网之鱼
