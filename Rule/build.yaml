version: 1
# 人工维护各组的 .list；正式 MRS 由 Actions 编译，其他客户端同步导出。
publish_base: https://raw.githubusercontent.com/NZESupB/Profile/rules
# 公开 GitHub 文件下载使用 ghproxy URL 前缀，保留原始来源与 SHA-256。
github_proxy: https://gh-proxy.com/
# 参考规则在个人优先规则之后、综合兜底之前展开，来源逐项锁定。
reference:
  lock: aisouler.lock.json
  dns_only: [fakeip_filter]
  before: RULE-SET,国际媒体,全球互联
  policies:
    直连: 直连域名
    REJECT: REJECT
    AdBlock: 广告拦截
    FCM: DIRECT
    YouTube: 全球互联
    Google: 全球互联
    AI: 🇺🇸 美国
    GitHub: 全球互联
    Microsoft: 测速下载
    Apple: 测速下载
    Telegram: TelegramDC5
    Steam: 游戏娱乐
    TikTok: 全球互联
    Twitter: 全球互联
    Meta: 全球互联
    Line: 全球互联
    Netflix: 全球互联
    Emby: 全球互联
    PikPak: 全球互联
    Spotify: 全球互联
    Crypto: 全球互联
    PayPal: 全球互联
    Patreon: 全球互联
    EHentai: 全球互联
    默认代理: 全球互联
    漏网之鱼: 漏网之鱼
  dns_policy_reuse:
    'rule-set:private': 'rule-set:国内域名,私有域名'
    'rule-set:cn': 'rule-set:国内域名,私有域名'
# 内联来源保留参考配置的一基路由序号，禁止跨位置合并。
inline:
  aisouler-inline-001: {provider: 参考_内联_001, route: 'DOMAIN,cdn.jsdmirror.com,直连'}
  aisouler-inline-008: {provider: 参考_内联_008, route: 'DOMAIN,fsend.cn,直连'}
  aisouler-inline-009: {provider: 参考_内联_009, route: 'DOMAIN,international-gfe.download.nvidia.com,直连'}
  aisouler-inline-010: {provider: 参考_内联_010, route: 'DOMAIN-SUFFIX,ctaiot.com,直连'}
  aisouler-inline-038: {provider: 参考_内联_038, route: 'DOMAIN-SUFFIX,mb3admin.com,Emby'}
  aisouler-inline-039: {provider: 参考_内联_039, route: 'DOMAIN-SUFFIX,nubebelle.com,Emby'}
  aisouler-inline-040: {provider: 参考_内联_040, route: 'DOMAIN-KEYWORD,emby,Emby'}
  aisouler-inline-041: {provider: 参考_内联_041, route: 'PROCESS-NAME,com.mb.android,Emby'}
  aisouler-inline-042: {provider: 参考_内联_042, route: 'PROCESS-NAME,tv.emby.embyatv,Emby'}
  aisouler-inline-043: {provider: 参考_内联_043, route: 'PROCESS-NAME,com.hush.yamby,Emby'}
  aisouler-inline-044: {provider: 参考_内联_044, route: 'PROCESS-NAME,com.jellycine.app,Emby'}
  aisouler-inline-045: {provider: 参考_内联_045, route: 'PROCESS-NAME,com.mountains.hills,Emby'}
  aisouler-inline-046: {provider: 参考_内联_046, route: 'PROCESS-NAME,RodelPlayer.App.exe,Emby'}
  aisouler-inline-047: {provider: 参考_内联_047, route: 'PROCESS-NAME,com.feifeiduck.capyplayer,Emby'}
local:
  Daily.list: {provider: 轻量浏览, classical: classical/Daily.list}
  Direct.list: {provider: 其他直连}
  Download.list: {provider: 海外下载, classical: classical/Download.list}
  GameDirect.list: {provider: 游戏直连}
  Games.list: {provider: 游戏娱乐, classical: classical/Games.list}
  Reject.list: {provider: Reject_List}
  Speedtest.list:
    provider: SpeedTest
    classical: classical/Speedtest.list
    exclusions:
      USER-AGENT,SpeedTest*: Mihomo 不支持 USER-AGENT；其他支持的客户端继续导出
  Torrent.list: {provider: null, classical: classical/Torrent.list}
  Video.list: {provider: 其他媒体}
  jp.list: {provider: JP_List}
  tw.list: {provider: null}
  us.list: {provider: US_List}
dns_filter: fakeipfillter.txt
# classical 输入按连续区段拆成 MRS/classical，保留关键词与原始顺序。
# 现成 MRS 必须配套锁定同版 text 来源；Actions 校验两者匹配集合。
upstreams:
  category-dev: {provider: 开发服务, behavior: classical, format: yaml}
  games-cn: {provider: 国内游戏, behavior: classical, format: yaml}
  games: {provider: 公共游戏, behavior: classical, format: yaml}
  stream: {provider: 国际媒体, behavior: classical, format: text}
  stream-ip: {provider: 国际媒体IP, behavior: classical, format: text}
  global: {provider: 全局规则, behavior: classical, format: text}
  china-ip: {provider: CN_IP, behavior: classical, format: text}
  private: {provider: 私有域名, behavior: domain, format: mrs}
  googlefcm: {provider: FCM域名, behavior: domain, format: mrs}
  github: {provider: GitHub域名, behavior: domain, format: mrs}
  category-scholar-!cn: {provider: 学术域名, behavior: domain, format: mrs}
  category-ads-all: {provider: 广告域名, behavior: domain, format: mrs}
  apple@cn: {provider: 苹果国内, behavior: domain, format: mrs}
  apple: {provider: 苹果服务, behavior: domain, format: mrs}
  microsoft@cn: {provider: 微软国内, behavior: domain, format: mrs}
  microsoft: {provider: 微软服务, behavior: domain, format: mrs}
  youtube: {provider: YouTube域名, behavior: domain, format: mrs}
  twitter: {provider: Twitter域名, behavior: domain, format: mrs}
  telegram: {provider: Telegram域名, behavior: domain, format: mrs}
  cn: {provider: 国内域名, behavior: domain, format: mrs}
  google: {provider: Google域名, behavior: domain, format: mrs}
  category-ai-!cn: {provider: AI域名, behavior: domain, format: mrs}
  netflix: {provider: Netflix域名, behavior: domain, format: mrs}
  spotify: {provider: Spotify域名, behavior: domain, format: mrs}
  private-ip: {provider: 私有IP, behavior: ipcidr, format: mrs}
  telegram-ip: {provider: TelegramIP, behavior: ipcidr, format: mrs}
  cn-ip: {provider: 国内IP, behavior: ipcidr, format: mrs}
  asn-44907: {provider: TelegramASN44907, behavior: ipcidr, format: mrs}
  asn-62014: {provider: TelegramASN62014, behavior: ipcidr, format: mrs}
  asn-59930: {provider: TelegramASN59930, behavior: ipcidr, format: mrs}
  asn-62041: {provider: TelegramASN62041, behavior: ipcidr, format: mrs}
  asn-211157: {provider: TelegramASN211157, behavior: ipcidr, format: mrs}
  openai: {provider: OpenAI域名, behavior: domain, format: mrs}
  connectivity-check: {provider: 连通性检测, behavior: domain, format: mrs}
  openai-extra:
    provider: OpenAI
    behavior: classical
    format: text
    expand_rules:
      IP-ASN,20473,no-resolve: AS20473
  stream-extra: {provider: 国际媒体2, behavior: classical, format: text}
  download-domainset: {provider: download_domainset, behavior: domain, format: text}
  lan: {provider: lan_ip, behavior: classical, format: text}
  telegram-sukka: {provider: telegram_ip, behavior: classical, format: text}
# 输出片段对接现有客户端模板；策略名映射与来源独立维护。
client_policies:
  clash: &client_policies
    直连域名: DIRECT
    🇭🇰 香港: 香港
    🇯🇵 日本: 日本
    🇺🇸 美国: 美国
    🇸🇬 新加坡: 新加坡
    🇹🇼 台湾: 台湾
    直连Fallback: 直连Fallback
    TelegramDC5: Telegram
  surge: *client_policies
  surfboard: *client_policies
  shadowrocket: *client_policies
  quantumultx: *client_policies
# 这里维护拆分前的逻辑路由；模板中的 MRS/classical 引用由构建器展开。
routing:
  dns:
    fake-ip-filter:
      - +.lan
      - +.local
      - rule-set:国内域名,连通性检测,私有域名,其他直连
    nameserver-policy:
      'rule-set:国内域名,私有域名':
        - system
        - https://120.53.53.53/dns-query
        - https://223.5.5.5/dns-query
  rules:
    - IP-CIDR,192.168.32.1/24,直连Fallback,no-resolve
    - RULE-SET,FCM域名,DIRECT
    - DOMAIN-SUFFIX,air.114432.xyz,全球互联
    - AND,((NETWORK,UDP),(OR,((DST-PORT,12345),(DOMAIN-KEYWORD,bilibili),(DOMAIN-KEYWORD,mcdn)))),REJECT
    - AND,((NETWORK,TCP),(DOMAIN-KEYWORD,stun),(OR,((DOMAIN-KEYWORD,douyu),(DOMAIN-KEYWORD,bilibili)))),REJECT
    - AND,((NETWORK,UDP),(OR,((RULE-SET,YouTube域名),(RULE-SET,OpenAI域名)))),REJECT
    - AND,((NETWORK,TCP),(NOT,((RULE-SET,CN_IP,no-resolve))),(OR,((DST-PORT,65022),(DST-PORT,22)))),全球互联
    - RULE-SET,开发服务,测速下载
    - RULE-SET,国内游戏,DIRECT
    - RULE-SET,游戏直连,DIRECT
    - RULE-SET,海外下载,测速下载
    - RULE-SET,SpeedTest,测速下载
    - RULE-SET,download_domainset,测速下载
    - RULE-SET,轻量浏览,全球互联
    - RULE-SET,国内域名,直连域名
    - RULE-SET,GitHub域名,全球互联
    - RULE-SET,学术域名,全球互联
    - RULE-SET,Reject_List,REJECT
    - RULE-SET,公共游戏,游戏娱乐
    - RULE-SET,游戏娱乐,游戏娱乐
    - RULE-SET,OpenAI域名,🇺🇸 美国
    - RULE-SET,OpenAI,🇺🇸 美国
    - RULE-SET,US_List,🇺🇸 美国
    - RULE-SET,JP_List,🇯🇵 日本
    - RULE-SET,其他直连,直连域名
    - RULE-SET,广告域名,广告拦截
    - RULE-SET,苹果国内,直连域名
    - RULE-SET,苹果服务,测速下载
    - RULE-SET,微软服务,测速下载
    - AND,((NETWORK,UDP),(DST-PORT,3478)),测速下载
    - RULE-SET,YouTube域名,全球互联
    - RULE-SET,Twitter域名,全球互联
    - RULE-SET,其他媒体,全球互联
    - RULE-SET,telegram_ip,TelegramDC5,no-resolve
    - RULE-SET,Telegram域名,TelegramDC5
    - RULE-SET,国际媒体,全球互联
    - RULE-SET,全局规则,全球互联
    - RULE-SET,国际媒体2,全球互联
    - RULE-SET,国际媒体IP,全球互联,no-resolve
    - RULE-SET,lan_ip,DIRECT,no-resolve
    - RULE-SET,CN_IP,直连域名,no-resolve
    - MATCH,漏网之鱼
